[logging]
# Used by scripts and ready for future app-level structured logging.
level = "debug"
rust_log = "info,qs_app=debug,qs_api=debug,qs_orchestrator=debug,qs_storage=debug,qs_data=debug,qs_search=debug,qs_backtest=debug,qs_validation=debug,qs_export=debug"
backtrace = true
log_directory = "./logs"

[debug_bundle]
include_logs = true
include_configs = true
include_run_json = true
include_jsonl_results = true
include_artifacts = true
